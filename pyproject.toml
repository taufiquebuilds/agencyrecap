[project]
name = "clientreport"
version = "0.1.0"
description = "Open-source monthly client reports for agencies"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "sqlmodel>=0.0.22",
    "apscheduler>=3.10,<4",
    "matplotlib>=3.9",
    "weasyprint>=63",
    "cryptography>=43",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "requests>=2.32",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "pypdf>=5.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
